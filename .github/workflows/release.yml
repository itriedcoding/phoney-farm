name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_FILE: app/build.gradle.kts

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Phone Farm $VERSION"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "PhoneFarm-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: PhoneFarm-*.apk
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Desktop $VERSION"

      - name: Ensure WiX toolset
        shell: pwsh
        run: |
          function Refresh-Path {
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          Refresh-Path
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            Refresh-Path
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $candidate = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) {
              $env:Path += ";$($candidate.FullName)\bin"
              "$($candidate.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) { throw "WiX toolset is required to build the .exe installer" }
          Write-Host "candle: $($candle.Source)"

      - name: Build Windows installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew -p desktop packageReleaseExe --no-daemon --stacktrace

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(ls desktop/build/compose/binaries/main-release/exe/*.exe | head -1)
          OUT="PhoneFarmDesktop-${{ steps.version.outputs.version }}.exe"
          cp "$EXE" "$OUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: PhoneFarmDesktop-*.exe
          if-no-files-found: error

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: actions/download-artifact@v4
        with:
          name: desktop

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh
          NOTES="docs/release-notes/v${VERSION}.md"
          ASSETS=(PhoneFarm-"${VERSION}".apk PhoneFarmDesktop-"${VERSION}".exe)
          for asset in "${ASSETS[@]}"; do test -f "$asset"; done
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "${ASSETS[@]}" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "v${VERSION}" "${ASSETS[@]}" \
              --title "Phone Farm ${VERSION}" \
              --notes-file "$NOTES" \
              --latest
          else
            gh release create "v${VERSION}" "${ASSETS[@]}" \
              --title "Phone Farm ${VERSION}" \
              --generate-notes \
              --latest
          fi
          gh release view "v${VERSION}" --json url,assets --jq '.url, (.assets[].name)'
